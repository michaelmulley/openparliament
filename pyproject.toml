[project]
name = "openparliament"
version = "0.1.0"
description = "A website to present the goings-on of Canada's House of Commons"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "Django >=6.1,<6.2",
    "dj-database-url",
    "django-compressor",
    "django-extensions",
    "django-libsass",
    "django-recaptcha",
    "Pillow",
    "lxml",
    "lxml_html_clean",
    "cssselect",
    "Markdown",
    "pysolr",
    "requests",
    "psycopg[pool]",
    "webob",
    "oauth2client",
    "whitenoise",
]

[project.optional-dependencies]
production = [
    "redis",
    "hiredis",
    "gunicorn[gevent]",
    "calmjs",
    "sentry-sdk"
]

[tool.uv]
exclude-newer = "1 week"

